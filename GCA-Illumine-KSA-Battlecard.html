  /* ---------- Theme tokens: light default, dark via system preference or manual toggle ---------- */
  :root{
    --bg-primary:#f5f6fa;
    --bg-elevated:#ffffff;
    --bg-surface:#ffffff;
    --bg-hover:#eef0f6;
    --text-primary:#14182a;
    --text-secondary:rgba(20,24,42,0.78);
    --text-muted:rgba(20,24,42,0.58);
    --accent:#7c3aed;
    --accent-hover:#6d28d9;
    --accent2:#0e7490;
    --you-win:#047857;
    --they-win:#b91c1c;
    --tie:#b45309;
    --border:rgba(20,24,42,0.12);
    --header-wash:linear-gradient(135deg,#ede9fe 0%,#ffffff 60%);
    --pill-us-bg:rgba(124,58,237,0.12);   --pill-us-text:#5b21b6;
    --danger-bg:rgba(185,28,28,0.10);     --danger-text:#991b1b;  --danger-border:rgba(185,28,28,0.28);
    --warn-bg:rgba(180,83,9,0.10);        --warn-text:#92400e;    --warn-border:rgba(180,83,9,0.30);
    --low-bg:rgba(20,24,42,0.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-primary:#0a0d14; --bg-elevated:#0f131c; --bg-surface:#161b28; --bg-hover:#1e2536;
      --text-primary:#ffffff; --text-secondary:rgba(255,255,255,0.72); --text-muted:rgba(255,255,255,0.5);
      --accent:#a855f7; --accent-hover:#9333ea; --accent2:#22d3ee;
      --you-win:#10b981; --they-win:#ef4444; --tie:#f59e0b; --border:rgba(255,255,255,0.09);
      --header-wash:linear-gradient(135deg,#1a0f2e 0%,#0f131c 60%);
      --pill-us-bg:rgba(168,85,247,0.18);  --pill-us-text:#d8b4fe;
      --danger-bg:rgba(239,68,68,0.16);    --danger-text:#fca5a5;  --danger-border:rgba(239,68,68,0.3);
      --warn-bg:rgba(245,158,11,0.10);     --warn-text:#fde68a;    --warn-border:rgba(245,158,11,0.28);
      --low-bg:rgba(255,255,255,0.08);
    }
  }
  :root[data-theme="dark"]{
    --bg-primary:#0a0d14; --bg-elevated:#0f131c; --bg-surface:#161b28; --bg-hover:#1e2536;
    --text-primary:#ffffff; --text-secondary:rgba(255,255,255,0.72); --text-muted:rgba(255,255,255,0.5);
    --accent:#a855f7; --accent-hover:#9333ea; --accent2:#22d3ee;
    --you-win:#10b981; --they-win:#ef4444; --tie:#f59e0b; --border:rgba(255,255,255,0.09);
    --header-wash:linear-gradient(135deg,#1a0f2e 0%,#0f131c 60%);
    --pill-us-bg:rgba(168,85,247,0.18);  --pill-us-text:#d8b4fe;
    --danger-bg:rgba(239,68,68,0.16);    --danger-text:#fca5a5;  --danger-border:rgba(239,68,68,0.3);
    --warn-bg:rgba(245,158,11,0.10);     --warn-text:#fde68a;    --warn-border:rgba(245,158,11,0.28);
    --low-bg:rgba(255,255,255,0.08);
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  :root[data-theme="light"]{color-scheme:light;}
  :root[data-theme="dark"]{color-scheme:dark;}
  body{
    margin:0;
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  /* Arabic: dedicated font stack, roomier leading, no letter-spacing (it breaks Arabic joining) */
  html[lang="ar"] body{
    font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,"Geeza Pro","Arabic Typesetting",sans-serif;
    line-height:1.75;
  }
  html[dir="rtl"] *{letter-spacing:0 !important;}

  header{padding:24px 32px 20px;background:var(--header-wash);border-bottom:1px solid var(--border);}
  header .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .logo-glyph{width:26px;height:26px;border-radius:6px;background:conic-gradient(from 90deg,#ec4899,#22d3ee,#a855f7,#f59e0b,#ec4899);flex-shrink:0;}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.02em;}
  header p{margin:4px 0 0;color:var(--text-muted);font-size:13px;}
  header .meta{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--text-secondary);}
  header .meta span b{color:var(--text-primary);}
  .toolbar{margin-inline-start:auto;display:flex;gap:8px;}
  .tbtn{
    font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;
    border:1px solid var(--border);background:var(--bg-surface);color:var(--text-primary);
    transition:background .15s ease;
  }
  .tbtn:hover{background:var(--bg-hover);}
  .tbtn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  nav.tabs{
    display:flex;flex-wrap:wrap;gap:6px;padding:14px 32px;
    background:var(--bg-elevated);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .tab{
    font:inherit;padding:9px 16px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg-surface);color:var(--text-secondary);
    font-size:13px;font-weight:600;cursor:pointer;transition:all .18s ease;white-space:nowrap;
  }
  .tab:hover{background:var(--bg-hover);color:var(--text-primary);}
  .tab.active{background:linear-gradient(135deg,var(--accent),#6366f1);color:#fff;border-color:transparent;}
  .tab .flag{display:inline-block;margin-inline-start:6px;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn-text);font-weight:700;}
  .tab.active .flag{background:rgba(255,255,255,0.22);color:#fff;}

  main{padding:26px 32px 60px;max-width:1280px;margin:0 auto;}
  .tab-content{display:none;}
  .tab-content.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){.tab-content.active{animation:none;}}

  h2.section-title{font-size:19px;margin:0 0 4px;letter-spacing:-0.01em;}
  p.section-sub{color:var(--text-muted);font-size:13px;margin:0 0 18px;}
  .hl{color:var(--text-primary);}
  .sect{margin-top:24px;}
  .sect-lg{margin-top:28px;}
  .hint{color:var(--text-muted);font-size:12px;font-weight:400;}

  .card{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .card p.body{font-size:13.5px;color:var(--text-secondary);margin:0 0 8px;}
  .card p.body:last-child{margin-bottom:0;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}header,nav.tabs,main,footer{padding-inline:16px;}}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--border);vertical-align:top;}
  thead th{position:sticky;top:0;background:var(--bg-surface);color:var(--text-secondary);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  tbody tr:hover{background:var(--bg-hover);}
  .center{text-align:center;}
  th.center,td.center{text-align:center;}
  .yes{color:var(--you-win);font-weight:800;}
  .no{color:var(--they-win);font-weight:800;}
  .partial{color:var(--tie);font-weight:800;}
  sup.fn{color:var(--text-muted);}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.us{background:var(--pill-us-bg);color:var(--pill-us-text);}
  .pill.threat-high{background:var(--danger-bg);color:var(--danger-text);}
  .pill.threat-med{background:var(--warn-bg);color:var(--warn-text);}
  .pill.threat-low{background:var(--low-bg);color:var(--text-muted);}

  ul.clean{margin:0;padding:0;list-style:none;}
  ul.clean li{padding-block:6px;padding-inline-start:20px;position:relative;font-size:13.5px;color:var(--text-secondary);border-bottom:1px dashed var(--border);}
  ul.clean li:last-child{border-bottom:none;}
  ul.clean.win li:before{content:"▲";position:absolute;inset-inline-start:0;color:var(--you-win);font-size:10px;top:9px;}
  ul.clean.lose li:before{content:"▼";position:absolute;inset-inline-start:0;color:var(--they-win);font-size:10px;top:9px;}
  ul.clean.plain li:before{content:"–";position:absolute;inset-inline-start:0;color:var(--text-muted);}
  ul.clean.mine li:before{content:"⚠";position:absolute;inset-inline-start:0;color:var(--tie);font-size:11px;top:6px;}

  .badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .badge{background:var(--bg-hover);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:11.5px;color:var(--text-secondary);}
  .badge b{color:var(--text-primary);}

  .profile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
  .profile-head h2{margin:0;font-size:24px;}
  .profile-head .sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
  .talk-track{
    border-inline-start:3px solid var(--accent);padding:10px 14px;background:var(--bg-elevated);
    border-start-end-radius:8px;border-end-end-radius:8px;margin-bottom:10px;font-size:13.5px;color:var(--text-secondary);
  }
  .talk-track b{color:var(--text-primary);}
  .landmine{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;color:var(--warn-text);}
  .objection{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:var(--bg-elevated);}
  .objection .q{font-size:13.5px;color:var(--danger-text);font-weight:600;margin-bottom:4px;}
  .objection .a{font-size:13.5px;color:var(--text-secondary);}

  .stat-tile{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-align:center;}
  .stat-tile .num{font-size:22px;font-weight:800;color:var(--accent2);direction:ltr;unicode-bidi:isolate;}
  .stat-tile .label{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

  .logo-strip{display:flex;flex-wrap:wrap;gap:8px;}
  .logo-chip{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-secondary);direction:ltr;unicode-bidi:isolate;}

  footer{padding:20px 32px 40px;color:var(--text-muted);font-size:11.5px;border-top:1px solid var(--border);}
  .caveat{font-size:11.5px;color:var(--text-muted);margin-top:10px;font-style:italic;}
  html[lang="ar"] .caveat{font-style:normal;}
  a{color:var(--accent2);text-decoration:none;}
  a.site{direction:ltr;unicode-bidi:isolate;display:inline-block;}
  .addons-label{font-size:12px;color:var(--accent2);margin:10px 0 4px;font-weight:700;}
</style>
</head>

// ======================= STATE & DATA ACCESSORS =======================
let LANG = "en", THEME = null, ACTIVE = "matrix";
const isAr = () => LANG === "ar";
const ui = () => UI[LANG];
const D = () => isAr() ? {...ILLUMINE, ...ILLUMINE_AR} : ILLUMINE;
const COMPS = () => COMPETITORS.map(c => isAr() ? {...c, ...COMPETITORS_AR[c.id]} : c);
const FEATS = () => MATRIX_ROWS.map((r,i) => ({...r, feat: isAr() ? MATRIX_FEAT_AR[i] : r.feat}));
const COLS = () => isAr() ? MATRIX_COLS_AR : MATRIX_COLS;

function symbol(v){
  if(v==="y"||v==="y1"||v==="y2") return '<span class="yes">✓</span>'+(v==="y1"?'<sup class="fn">1</sup>':v==="y2"?'<sup class="fn">2</sup>':"");
  if(v==="n") return '<span class="no">✗</span>';
  if(v==="p") return '<span class="partial">~</span>';
  return v;
}
function threatPill(t,label){
  const cls = t==="high"?"threat-high":t==="med"?"threat-med":"threat-low";
  return `<span class="pill ${cls}">${label}</span>`;
}

// ======================= TAB RENDERERS =======================
function renderMatrixTab(){
  const T = ui(), d = D(), comps = COMPS();
  const rows = FEATS().map(r=>`<tr><td>${r.feat}</td>${r.vals.map(v=>`<td class="center">${symbol(v)}</td>`).join("")}</tr>`).join("");
  const head = COLS().map((c,i)=>`<th class="center">${i===0?`<span class="pill us">${c}</span>`:c}</th>`).join("");
  const threatCards = comps.map(c=>`
    <div class="card">
      <h3><span class="dot" style="background:${c.threat==='high'?'var(--they-win)':c.threat==='med'?'var(--tie)':'var(--text-muted)'}"></span>${c.name} ${threatPill(c.threat,c.threatLabel)}</h3>
      <p style="color:var(--text-secondary);font-size:13px;margin:0 0 8px;">${c.tagline}</p>
      <p style="color:var(--text-muted);font-size:12.5px;margin:0;">${c.scale}</p>
    </div>`).join("");

  return `
    <h2 class="section-title">${T.mTitle}</h2>
    <p class="section-sub">${T.mSub}</p>

    <div class="card">
      <h3><span class="dot" style="background:var(--accent)"></span>${T.execTitle}</h3>
      <p class="body">${T.exec1}</p>
      <p class="body">${T.exec2}</p>
    </div>

    <div class="grid2" style="margin-bottom:18px;">
      <div class="card">
        <h3><span class="dot" style="background:var(--you-win)"></span>${T.exposure}</h3>
        <ul class="clean mine">${d.gaps.map(g=>`<li>${g}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <h3><span class="dot" style="background:var(--accent2)"></span>${T.quickWins}</h3>
        <ul class="clean plain">${T.qw.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>
    </div>

    <h3 class="sect-lg">${T.threatTitle}</h3>
    <div class="grid3">${threatCards}</div>

    <h3 class="sect-lg">${T.featTitle}</h3>
    <div class="card" style="overflow-x:auto;">
      <table>
        <thead><tr><th>${T.thFeature}</th>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <h3 class="sect-lg">${T.pricingTitle}</h3>
    <div class="grid2">
      <div class="card">
        <h3>${T.perStudentTitle}</h3>
        <table>
          <thead><tr><th>${T.thTier}</th><th>${T.thUsd}</th><th>${T.thSar}</th></tr></thead>
          <tbody>${d.pricingTiers.map(t=>`<tr><td>${t.tier}</td><td>${t.usd}</td><td>${t.sar}</td></tr>`).join("")}</tbody>
        </table>
        <p class="caveat">${T.centerFeeNote}${d.discounts}</p>
      </div>
      <div class="card">
        <h3>${T.knownTitle}</h3>
        <ul class="clean plain">${T.known.map(k=>`<li>${k}</li>`).join("")}</ul>
      </div>
    </div>
  `;
}

function renderCompetitorTab(c){
  const T = ui();
  return `
    <div class="profile-head">
      <div>
        <h2>${c.name}</h2>
        <p class="sub">${c.tagline} — <a class="site" href="https://${c.website}" target="_blank" rel="noopener">${c.website}</a></p>
      </div>
      ${threatPill(c.threat,c.threatLabel)}
    </div>

    <div class="badge-row"><span class="badge">${T.target}: <b>${c.target}</b></span></div>

    <div class="card"><h3>${T.scaleT}</h3><p class="body">${c.scale}</p></div>
    <div class="card"><h3>${T.recentT}</h3><p class="body">${c.recent}</p></div>

    <div class="grid2">
      <div class="card">
        <h3><span class="dot" style="background:var(--they-win)"></span>${T.theyWin}</h3>
        <ul class="clean lose">${c.win.map(w=>`<li>${w}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <h3><span class="dot" style="background:var(--you-win)"></span>${T.weWin}</h3>
        <ul class="clean win">${c.lose.map(l=>`<li>${l}</li>`).join("")}</ul>
      </div>
    </div>

    <div class="card"><h3>${T.pricingT}</h3><p class="body">${c.pricing}</p></div>

    <h3 class="sect">${T.talkT}</h3>
    ${c.talk.map(t=>`<div class="talk-track"><b>${t.label}:</b> ${t.text}</div>`).join("")}

    ${c.objections?`<h3 class="sect">${T.objT}</h3>${c.objections.map(o=>`<div class="objection"><div class="q">${o.q}</div><div class="a">${o.a}</div></div>`).join("")}`:""}

    <h3 class="sect">${T.landT} <span class="hint">${T.landSub}</span></h3>
    ${c.landmines.map(l=>`<div class="landmine">${T.q[0]}${l}${T.q[1]}</div>`).join("")}

    ${c.note?`<p class="caveat">${T.note}: ${c.note}</p>`:""}

}

// ======================= RENDER / LANGUAGE / THEME =======================
const nav = document.getElementById("tabnav");
const main = document.getElementById("maincontent");
const hdr = document.getElementById("hdr");
const ftr = document.getElementById("ftr");

function effectiveTheme(){
  return THEME || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function render(){
  const T = ui(), comps = COMPS();
  const root = document.documentElement;
  root.lang = LANG; root.dir = isAr() ? "rtl" : "ltr";
  document.title = T.title;
  if(THEME) root.dataset.theme = THEME; else delete root.dataset.theme;

  const nextTheme = effectiveTheme()==="dark" ? "light" : "dark";
  hdr.innerHTML = `
    <div class="brandrow">
      <div class="logo-glyph"></div>
      <h1>${T.h1}</h1>
      <div class="toolbar">
        <button class="tbtn" id="themeBtn" type="button">${nextTheme==="dark"?T.themeDark:T.themeLight}</button>
        <button class="tbtn" id="langBtn" type="button" lang="${isAr()?'en':'ar'}" aria-label="${T.langAria}">${T.langBtn}</button>
      </div>
    </div>
    <p>${T.sub}</p>
    <div class="meta">${T.meta.map(([k,v])=>`<span>${k}: <b>${v}</b></span>`).join("")}</div>`;
  document.getElementById("langBtn").onclick = ()=>{ LANG = isAr()?"en":"ar"; store("bc-lang",LANG); render(); };
  document.getElementById("themeBtn").onclick = ()=>{ THEME = nextTheme; store("bc-theme",THEME); render(); };
  ftr.textContent = T.footer;

  const TABS = [
    {id:"matrix", label:T.tabMatrix, html:renderMatrixTab()},
    {id:"illumine", label:T.tabIllumine, html:renderIllumineTab()},
    ...comps.map(c=>({id:c.id, label:c.name, flag:c.threat==="high", html:renderCompetitorTab(c)})),
  ];
  nav.innerHTML = ""; main.innerHTML = "";
  TABS.forEach(t=>{
    const on = t.id===ACTIVE;
    const btn = document.createElement("button");
    btn.className = "tab"+(on?" active":"");
    btn.type = "button"; btn.dataset.tab = t.id;
    btn.setAttribute("role","tab"); btn.setAttribute("aria-selected", on);
    btn.innerHTML = t.label + (t.flag?` <span class="flag">${T.watch}</span>`:"");
    btn.onclick = ()=> activate(t.id);
    nav.appendChild(btn);
    const sec = document.createElement("div");
    sec.className = "tab-content"+(on?" active":"");
    sec.id = "panel-"+t.id;
    sec.innerHTML = t.html;
    main.appendChild(sec);
  });
}

function activate(id){
  ACTIVE = id;
  document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.tab===id; b.classList.toggle("active",on); b.setAttribute("aria-selected",on);});
  document.querySelectorAll(".tab-content").forEach(p=>p.classList.toggle("active", p.id==="panel-"+id));
  window.scrollTo({top:0,behavior:"smooth"});
}

(function init(){
  const l = load("bc-lang"), t = load("bc-theme");
  LANG = (l==="ar"||l==="en") ? l : ((navigator.language||"").toLowerCase().startsWith("ar") ? "ar" : "en");
  if(t==="light"||t==="dark") THEME = t;
  const q = new URLSearchParams(location.search).get("lang");
  if(q==="ar"||q==="en") LANG = q;
  render();
})();
</script>
