<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECRA | Account Activated</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f0e8;
      color: #334159;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .banner {
      width: 100%;
      display: block;
    }

    .content {
      padding: 32px 28px;
    }

    h1, h2, p {
      margin-top: 0;
    }

    h1, h2 {
      color: #0f172a;
    }

    .section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-primary {
      background: #334159;
      color: white;
    }

    .btn-secondary {
      background: #eacb98;
      color: #334159;
    }

    .footer {
      margin-top: 24px;
      font-size: 14px;
    }

    .rtl {
      direction: rtl;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <img
        class="banner"
        src="https://qnfeempfsfymbkysnoik.supabase.co/storage/v1/object/public/email-assets/welcome.png"
        alt="ECRA"
      />

      <div class="content">
        <h1>Account Activated Successfully</h1>
        <p>
          Your account has been activated successfully. Please open the ECRA mobile
          application to continue.
        </p>

        <div class="section rtl">
          <h2>تم تفعيل الحساب بنجاح</h2>
          <p>
            تم تفعيل حسابك بنجاح. يرجى فتح تطبيق ECRA للمتابعة.
          </p>
        </div>

        <div class="actions" style="display: flex; justify-content: center;">
          <a
            class="btn btn-primary"
            href="https://testflight.apple.com/join/MPsjUZZ7"
          >
            Download on iPhone
          </a>

          <!-- <a
            class="btn btn-secondary"
            href="https://play.google.com/store"
          >
            Download on Android
          </a> -->

          <a
            class="btn btn-secondary"
            href="https://qnfeempfsfymbkysnoik.supabase.co/storage/v1/object/public/email-assets/How%20to%20Download%20the%20App.pdf"
          >
            Open Instructions PDF
          </a>
        </div>

        <div class="footer">
          Need help?
          <a href="mailto:support@ecraccreditation.org">support@ecraccreditation.org</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
